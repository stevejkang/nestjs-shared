name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type
        required: true
        type: choice
        options:
          - minor
          - patch
          - major
        default: minor

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-pr:
    name: Create release PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create or update release PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout -B changeset-release/main
          PKG=$(node -p "require(require('fs').readdirSync('packages').map(d => './packages/'+d+'/package.json').find(f => require('fs').existsSync(f))).name")
          printf -- "---\n'%s': %s\n---\n\nRelease\n" "${PKG}" "${{ inputs.bump }}" > .changeset/release.md
          pnpm changeset:version
          VERSION=$(node -p "require(require('fs').readdirSync('packages').map(d => './packages/'+d+'/package.json').find(f => require('fs').existsSync(f))).version")
          git add -A
          git commit -m "Release"
          git push --force origin changeset-release/main
          EXISTING_PR=$(gh pr list --base main --head changeset-release/main --state open --json number -q '.[0].number')
          if [ -n "$EXISTING_PR" ]; then
            gh pr edit "$EXISTING_PR" --title "Release v${VERSION}"
          else
            gh pr create --base main --head changeset-release/main --title "Release v${VERSION}" --body "Automated lockstep version bump. Merging this PR publishes all packages to npm."
          fi
